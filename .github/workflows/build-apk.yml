name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MoiZametkiAndroid_GitHubBuild.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -q MoiZametkiAndroid_GitHubBuild.zip
          test -d MoiZametkiAndroid
          sed -i 's|android:description="Все разделы и заметки на рабочем столе"|android:description="@string/app_name"|' MoiZametkiAndroid/app/src/main/res/xml/notes_widget_info.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: MoiZametkiAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiZametki-debug-apk
          path: MoiZametkiAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
